<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>conversor-de-moedas</title>
</head>

<body>

    <img class="img-logo" src="assets/logo.gif" alt="img-logo">


    <main>
        <label for="">
            converter <b>de</b>
            <select name="" id="">
                <option value=""> R$ Real Brasileiro</option>
            </select>
        </label>

        <label for="">
            converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US Dolar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
            </select>
        </label>
        <label for="">
            Valor
            <input class="input-currency" type="text" placeholder="R$ 10.000,00">
        </label>
        <button class="convert-button">Convereter</button>


        <section>
            <div class="currency-box"><img class="img-real" src="assets/Real.png" alt="">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 10.000,00</p>
            </div>

            <img class="arrow-img" src="assets/Vector.png" alt="">

            <div class="currency-box"><img class="currency-img" src="assets/dolar.png" alt=""></div>
            <p class="currency" id="currency-name">Dolar americano</p>
            <p class="currency-value">10.000,00</p>

        </section>
    </main>
    <script src="scripts.js"></script>
</body>

</html>
